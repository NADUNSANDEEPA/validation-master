<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Response Format - verify-master</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">

    <h1 class="mb-4">📋 Response Format</h1>

    <h3>✅ Success Response</h3>

<pre class="bg-success text-light p-3 rounded">
<code>
{
  success: true,
  status: 200,
  message: "Valid",
  data: "<cleaned_input>"
}
</code>
</pre>

    <h3 class="mt-4">❌ Failure Response</h3>

<pre class="bg-danger text-light p-3 rounded">
<code>
{
  success: false,
  status: 400,
  message: "Invalid format",
  data: null
}
</code>
</pre>

    <a href="index.html" class="btn btn-primary mt-4">
        Back Home
    </a>

</div>

</body>
</html>
