name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy-publish:
    runs-on: ubuntu-latest

    steps:
      # =================================================
      # 1. Checkout code (with full history)
      # =================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =================================================
      # 2. Setup Node.js (with npm registry)
      # =================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      # =================================================
      # 3. Cache npm dependencies (speeds up CI)
      # =================================================
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # =================================================
      # 4. Install dependencies
      # =================================================
      - name: Install Dependencies
        run: npm ci

      # =================================================
      # 5. Fix binary permissions (CI safety)
      # =================================================
      - name: Fix Permissions
        run: chmod -R +x node_modules/.bin || true

      # =================================================
      # 6. Run tests (let failing tests fail the job)
      # =================================================
      - name: Run Tests
        run: npm test
        # remove `|| true` so broken tests actually fail the pipeline [web:16]

      # =================================================
      # 7. Build project (Rollup)
      # =================================================
      - name: Build Project
        run: npm exec rollup -- -c

      # =================================================
      # 8. Deploy to Netlify
      # =================================================
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: ./dist
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Auto deploy from GitHub Actions"
          enable-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      # =================================================
      # 9. Publish to npm (only on main, after tests pass)
      # =================================================
      - name: Publish to npm
        run: |
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}